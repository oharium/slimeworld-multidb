# Inside this file is the configuration options
# for the data sources that SWM supports

# MySQL Configuration
mysql:
  enabled: false
  host: localhost
  port: 3306
  username: root
  password: ''
  database: database
  # Connection pool settings (optional)
  max-pool-size: 10
  min-idle: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

# MariaDB Configuration (uses same settings as MySQL)
mariadb:
  enabled: false
  host: localhost
  port: 3306
  username: root
  password: ''
  database: database
  # Connection pool settings (optional)
  max-pool-size: 10
  min-idle: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

# PostgreSQL Configuration
postgresql:
  enabled: false
  host: localhost
  port: 5432
  username: postgres
  password: ''
  database: postgres
  # Connection pool settings (optional)
  max-pool-size: 10
  min-idle: 2
  connection-timeout: 30000
  idle-timeout: 600000
  max-lifetime: 1800000

# File Storage Configuration
file:
  path: slime_worlds